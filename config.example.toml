# riffnav configuration — copy to ~/.config/riffnav/config.toml
# (or $XDG_CONFIG_HOME/riffnav/config.toml) and uncomment what you want to change.
# Every key is optional; omitted keys use the defaults shown here. CLI flags
# (e.g. -s/-u) override anything set here.

# Initial layout. Omit to follow your `delta.side-by-side` git config default.
# side_by_side = false

# File-tree glyphs: "nerd" (needs a Nerd Font) | "unicode" | "ascii".
# icon_style = "nerd"

# Diff color theme (cycle at runtime with `T`):
#   "github-dark"  – GitHub dark-mode diff colors (default)
#   "github-light" – GitHub light-mode colors (best on a light terminal)
#   "delta"        – inherit your gitconfig/delta theme
# diff_theme = "github-dark"

# Columns reserved for the file-tree pane, including its right border.
# tree_width = 32

# Show the file tree on launch (toggle at runtime with `e`).
# show_tree = true

# Where focus starts: "diff" opens straight into the first file (a single-file
# view — move between files with n/p), "tree" starts in the file list. Ignored
# when the tree is hidden.
# start_focus = "diff"

# Show the top summary bar / bottom hint bar.
# show_header = true
# show_footer = true

# Expand folders shallower than this depth on launch; deeper folders start
# collapsed. The large default expands everything; set e.g. 1 to collapse
# nested directories by default.
# open_depth = 64

# How long (days) to keep "viewed" review marks (toggled with `v`). Marks are
# saved per repo + branch; a branch untouched for longer is forgotten, as are
# older marks within an active branch.
# review_retention_days = 90

# After marking a file viewed with `v`, jump to the next unviewed file so review
# flows file-to-file. Set false to keep the selection put. Unmarking never moves.
# review_auto_advance = true

# Push "viewed" marks to the matching GitHub PR (one-way), ticking GitHub's
# per-file "Viewed" checkbox to match. Only syncs while reviewing the branch-vs-
# base view (the "committed" diff source) on a branch with an open PR; the
# uncommitted/staged/unstaged views stay local. Needs the `gh` CLI authenticated.
# review_sync_github = false

# --- Bare launch (running `riffnav` with no piped diff, inside a repo) ---

# Base branch for the "branch vs base" view. Omit to auto-detect it: origin/HEAD
# or a local main/master, whichever forks off the current branch later. Override
# per run with `riffnav diff --base <ref>`.
# base_branch = "main"

# Which diff `riffnav diff` shows when given no view flag (cycle at runtime with
# `d`, or jump to one with the number key beside it):
#   1 "all"              – everything since the branch forked: its commits plus
#                          staged + unstaged + untracked
#   2 "all-uncommitted"  – staged + unstaged + untracked, vs HEAD
#   3 "staged"           – staged changes only
#   4 "unstaged"         – unstaged changes only
#   5 "vs-base"          – branch vs base (git diff <base>...HEAD), like a PR diff
# Omit for "unstaged", matching plain `git diff` (plus untracked files, which
# `git diff` omits) — and, when that is empty, falling on to the narrowest view
# that still shows everything there is. Setting this key opts out of that
# fallback: a view you chose is shown as asked. Override per run with the
# matching flag (`riffnav diff --all`, `--all-uncommitted`, `--vs-base`,
# `--staged`, `--unstaged`). Ignored when you pass your own arguments to
# `riffnav diff`, so `riffnav diff HEAD~1` stays `git diff HEAD~1`.
# diff_source = "all"

# --- Inline review comments ---

# Show review comments beside the code, and bind the keys that write them:
# `c` comment on the cursor line (or reply, when it's inside a thread), `x`
# delete, `]`/`[` jump between them. Comments are written either here or by an
# AI agent running `riffnav comment add` in another terminal (see
# `riffnav skill`).
# Turning this off also turns off the diff pane's line cursor, so `j`/`k` scroll
# the pane instead of moving a cursor.
# show_comments = true

# Days to keep comments before they're garbage-collected, matching how
# review_retention_days ages out viewed marks. Comments are stored per repo and
# branch under $XDG_STATE_HOME/riffnav/comments/.
# comment_retention_days = 90

# Name recorded as the author of comments written here. Omit to use $USER. This
# is also the name drawn in the comment box's own color; every other author is
# colored by a hash of their name.
# comment_author = "olli"
